services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    init: true
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      NODE_ENV: production
      DB_LOCATION: /app/storage/arena.sqlite
      PUBLIC_ORIGINS: "${PUBLIC_ORIGINS:-http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}}"
    expose:
      - "3001"
    volumes:
      - arena-storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  arena-storage:
