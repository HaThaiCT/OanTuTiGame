[package]
name = "arena-runner"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "verify-trace"
path = "src/bin/verify_trace.rs"

[dependencies]
arena-engine = { path = "../arena-engine" }
arena-verifier = { path = "../arena-verifier" }
arena-execution = { path = "../arena-execution" }
prost = "=0.14.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[dev-dependencies]
parking_lot = "=0.12.5"
