map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 4m;
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # The public spectator socket lives at /api/v2/live/:gameId, so this location must carry the
    # upgrade headers as well; a plain proxy here would answer 200 and never reach a WebSocket.
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API honours this only for proxies named in OANTUTI_TRUSTED_PROXIES; without it every
        # client would share the proxy's address and therefore one login-throttle bucket.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 75s;
    }
}
