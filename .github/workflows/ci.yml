name: CI and container release

on:
  pull_request:
  push:
    branches: [main, rebuild/v2, release/lan-v2, develop/online-v2]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Workspace tests and Web build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: arena_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The server suites talk to a real PostgreSQL; the database name must contain "test" so the
      # suite-wide ADMIN fixture guard and the migration guard accept it.
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: arena_ci_test
      OANTUTI_DEV_EXECUTION: '1'
      OANTUTI_BACKUP_FENCE: 'off'
      OANTUTI_MIGRATION_TEST_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check bot toolchains
        run: |
          node --version
          python3 --version
          g++ --version
      - name: Install locked dependencies
        run: npm ci
      - name: Install the protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Build the Rust trace verifier
        # The server treats this binary as the rules authority and has no TypeScript fallback, so
        # the suite cannot pass without it. Debug profile matches the server's default lookup path.
        run: cargo build --locked -p arena-runner --bin verify-trace
      - name: Test Rust workspace
        run: cargo test --workspace --tests --locked
      - name: Typecheck server
        run: npx tsc --noEmit -p packages/server/tsconfig.json
      - name: Apply migrations to the isolated CI database
        env:
          # The applier refuses a raw PGPASSWORD value; it reads this private file and sets the
          # pg client environment itself. The following test step keeps the job-level password.
          PGPASSWORD: ''
          PGPASSWORD_FILE: ${{ runner.temp }}/pgpass
        run: |
          printf '%s' 'ci' > "$PGPASSWORD_FILE"
          chmod 600 "$PGPASSWORD_FILE"
          node --import tsx deploy/linux/apply-migrations.mts --apply --grant-to postgres
      - name: Prepare private storage directories
        run: |
          mkdir -p -m 700 storage/replays storage/replay-staging storage/submissions storage/execution storage/spool
          mkdir -p -m 700 ~/.local/share/oantuti/development/objects/replays ~/.local/share/oantuti/development/objects/staging ~/.local/share/oantuti/development/objects/sources
      - name: Run workspace tests
        run: npm test
      - name: Typecheck and build Web
        run: npm run build --workspace=@oantuti/web
      - name: Validate Compose configuration
        env:
          PG_OWNER_PASSWORD_FILE: /dev/null
          PG_APP_PASSWORD_FILE: /dev/null
          SMTP_PASSWORD_FILE: /dev/null
          MAIL_KEYRING_FILE: /dev/null
          OANTUTI_BACKUP_FENCE: 'off'
          OANTUTI_PUBLIC_BASE_URL: https://arena.example.invalid
          OANTUTI_TRUST_PROXY: 127.0.0.1
          OANTUTI_SMTP_HOST: smtp.example.invalid
          OANTUTI_SMTP_PORT: '465'
          OANTUTI_SMTP_TLS_MODE: implicit
          OANTUTI_SMTP_USER: ci
          OANTUTI_MAIL_FROM: arena@example.invalid
          OANTUTI_MAIL_REPLY_TO: support@example.invalid
          OANTUTI_BOOTSTRAP_ADMIN_EMAIL: admin@example.invalid
          OANTUTI_BOOTSTRAP_CONFIRM: arena
          OANTUTI_ACCOUNT_CAPACITY: '100'
          WEB_BIND: 127.0.0.1
          WEB_PORT: '3000'
        run: |
          docker compose config --quiet
          docker compose --profile ops config --quiet
          docker compose -f docker-compose.yml -f docker-compose.online.yml config --quiet
  release:
    name: Publish image (${{ matrix.image }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [verify, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, web]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Determine image name and validate release tag
        id: image
        env:
          IMAGE_SUFFIX: ${{ matrix.image }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_SUFFIX}"
          tag="sha-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Expected a release tag such as v1.2.3 or v1.2.3-rc.1" >&2
              exit 1
            fi
            tag="$RELEASE_TAG"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR for tag releases only
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (publish only on version tag)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  images:
    name: Docker image (${{ matrix.image }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [server, web]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          platforms: linux/amd64
          tags: oantuti-${{ matrix.image }}:ci
          load: ${{ matrix.image == 'server' }}
          push: false
      - name: Run trace verifier from the final server image
        if: matrix.image == 'server'
        run: |
          set +e
          output=$(printf '{}' | docker run --rm -i --entrypoint /app/bin/verify-trace \
            'oantuti-server:ci' 2>&1)
          status=$?
          set -e
          test "$status" -eq 2
          printf '%s' "$output" | python3 -c 'import json,sys; assert json.load(sys.stdin)["ok"] is False'
